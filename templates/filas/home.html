{% extends "filas/base.html" %}

{% block title %}CeciFácil — Selecione a UPA{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="text-center mb-8">
        <div class="text-5xl mb-3">🏥</div>
        <h2 class="text-2xl font-bold text-gray-800">Selecione sua unidade</h2>
        <p class="text-gray-500 mt-1">Escolha a UPA para entrar na fila.</p>
    </div>

    <div class="space-y-3">
        {% for upa in upas %}
        <a href="{% url 'entrar' upa.slug %}"
           class="block bg-white rounded-2xl shadow-sm border border-gray-100 px-6 py-5 hover:border-primary hover:bg-blue-50 transition group">
            <div class="flex items-center justify-between">
                <span class="font-semibold text-gray-800 group-hover:text-primary transition">{{ upa.nome }}</span>
                <span class="text-gray-400 group-hover:text-primary transition">→</span>
            </div>
        </a>
        {% empty %}
        <div class="text-center py-12 text-gray-400">
            <p>Nenhuma unidade disponível.</p>
        </div>
        {% endfor %}
    </div>

    <div class="mt-10 text-center">
        <a href="{% url 'login' %}" class="text-xs text-gray-400 hover:text-gray-600 transition underline underline-offset-2">
            Acesso da UPA
        </a>
    </div>
</div>
{% endblock %}
