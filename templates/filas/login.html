{% extends "filas/base.html" %}

{% block title %}Entrar — CeciFácil{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-8">
    <div class="text-center mb-8">
        <div class="text-5xl mb-3">🔐</div>
        <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
        <p class="text-gray-500 mt-1">Entre com suas credenciais</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST">
            {% csrf_token %}

            {% if erro %}
            <div class="mb-4 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3">
                {{ erro }}
            </div>
            {% endif %}

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Usuário</label>
                <input type="text" name="username" required autofocus
                    class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition" />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Senha</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition" />
            </div>

            <button type="submit"
                class="w-full bg-primary text-white font-semibold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition-all">
                Entrar →
            </button>
        </form>
    </div>
</div>
{% endblock %}
